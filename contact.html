<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Shrinidhi S</title>
  <meta name="description" content="Get in touch with Shrinidhi S for web development project inquiries and collaboration.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header role="banner">
    <div class="logo">
      <a href="index.html" aria-label="Shrinidhi S Homepage">Shrinidhi S</a>
    </div>
    
    <nav role="navigation" aria-label="Primary Navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" tabindex="-1">
    <section aria-labelledby="contact-heading">
      <h1 id="contact-heading">Get in Touch</h1>
      <p>Fill out the form below to discuss potential projects or collaborations.</p>

      <!-- Accessible Form -->
      <form action="/submit-form" method="POST" aria-describedby="form-instructions">
        <p id="form-instructions">Required fields are marked with an asterisk (*).</p>

        <fieldset>
          <legend>Your Contact Information</legend>

          <div class="form-group">
            <label for="full-name">Full Name <span aria-hidden="true">*</span></label>
            <input 
              type="text" 
              id="full-name" 
              name="name" 
              required 
              aria-required="true"
              autocomplete="name"
            >
          </div>

          <div class="form-group">
            <label for="email-address">Email Address <span aria-hidden="true">*</span></label>
            <input 
              type="email" 
              id="email-address" 
              name="email" 
              required 
              aria-required="true"
              aria-describedby="email-hint"
              autocomplete="email"
            >
            <small id="email-hint">We will never share your email address.</small>
          </div>

          <div class="form-group">
            <label for="subject">Subject</label>
            <input 
              type="text" 
              id="subject" 
              name="subject"
            >
          </div>

          <div class="form-group">
            <label for="message">Message <span aria-hidden="true">*</span></label>
            <textarea 
              id="message" 
              name="message" 
              rows="5" 
              required 
              aria-required="true"
            ></textarea>
          </div>
        </fieldset>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer role="contentinfo">
    <p>&copy; 2026 Shrinidhi S. All rights reserved.</p>
  </footer>

</body>
</html>
